name: Testes e demonstração local
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar
        run: python -m pip install -e .
      - name: Testes sem rede e sem credenciais
        run: python -m unittest discover -s tests -v
      - name: Relatório fictício local; nenhum Telegram
        run: python -m wallets.cli demo --output reports
