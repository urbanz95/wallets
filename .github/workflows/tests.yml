name: Testes de regressão

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -e .
      - name: Executar testes sem acesso a credenciais
        env:
          BIRDEYE_API_KEY: ''
          HELIUS_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          STATE_ENCRYPTION_KEY: ''
        run: python -m unittest discover -s tests -v
