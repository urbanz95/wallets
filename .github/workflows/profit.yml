name: Ranking privado por lucro — experiência sem Telegram
on:
  workflow_dispatch:
    inputs:
      validate_only:
        type: boolean
        default: false
      probe_wallet_access:
        type: boolean
        default: false
  workflow_call:
    inputs:
      validate_only:
        type: boolean
        default: false
      probe_wallet_access:
        type: boolean
        default: false
    secrets:
      STATE_ENCRYPTION_KEY:
        required: true
      BIRDEYE_API_KEY:
        required: true
      HELIUS_API_KEY:
        required: true
permissions:
  contents: write
concurrency:
  group: wallets-durable-state
  cancel-in-progress: false
jobs:
  validate:
    if: inputs.validate_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar
        run: python -m pip install -e .
      - name: Validar sem fornecedores, quota, cofres ou Telegram
        run: python -m unittest discover -s tests -v
  profit:
    if: ${{ !inputs.validate_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: urbanz95/wallets
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar
        run: python -m pip install -e .
      - name: Restaurar ledger principal para partilhar quotas
        id: restore
        run: python scripts/state_vault.py restore --db state/production.sqlite
      - name: Descobrir, pré-filtrar e classificar — sem Telegram
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PROBE_WALLET_ACCESS: ${{ inputs.probe_wallet_access }}
        shell: bash
        run: |
          args=()
          if [ "$PROBE_WALLET_ACCESS" = "true" ]; then args+=(--probe-wallet-access); fi
          python scripts/profit_experiment.py --production-db state/production.sqlite --db state/profit.sqlite --output reports/profit --config config.profit.toml "${args[@]}"

      - name: Cópia de recuperação cifrada
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-profit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/profit.sqlite.enc
            state/profit.sqlite.pending.enc
            state/production.sqlite.enc
            state/production.sqlite.pending.enc
          if-no-files-found: error
          retention-days: 90
      - name: Resumo público — só contagens, consumo e histograma
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profit-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/profit/experiment-summary.json
          if-no-files-found: ignore
          retention-days: 90
