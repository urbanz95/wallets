[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallets-solana-audit"
version = "0.2.0"
description = "Análise conservadora de carteiras Solana com Birdeye Standard e Helius Free"
requires-python = ">=3.11"
dependencies = ["cryptography==46.0.3"]

[project.scripts]
wallets = "wallets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
